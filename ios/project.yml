name: FilmLightMeter
options:
  bundleIdPrefix: com.lightmeter
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  FilmLightMeter:
    type: application
    platform: iOS
    sources:
      - path: FilmLightMeter
        excludes:
          - SupportingFiles/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lightmeter.app.ios
        PRODUCT_NAME: FilmLightMeter
        INFOPLIST_FILE: FilmLightMeter/SupportingFiles/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: targeted
    scheme:
      testTargets:
        - FilmLightMeterTests
  FilmLightMeterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FilmLightMeterTests
    dependencies:
      - target: FilmLightMeter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lightmeter.app.ios.tests
        GENERATE_INFOPLIST_FILE: YES
